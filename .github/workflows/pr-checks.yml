name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"
          # Enforce conventional commit style titles
          if echo "$PR_TITLE" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build)(\(.+\))?: .+"; then
            echo "✅ PR title follows conventional commits format"
          else
            echo "⚠️ PR title should follow: type(scope): description"
            echo "   Examples: feat(auth): add JWT refresh tokens"
            echo "             fix(tasks): resolve drag-drop on mobile"
          fi

      - name: Check branch naming
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"
          if echo "$BRANCH" | grep -qE "^(feature|fix|hotfix|release|chore|docs)/[a-z0-9-]+$"; then
            echo "✅ Branch name follows naming convention"
          else
            echo "⚠️ Branch should follow: type/description (e.g. feature/user-auth)"
          fi

  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          ADDITIONS=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | grep -oP '\d+ insertion' | grep -oP '\d+' || echo 0)
          echo "Lines added: $ADDITIONS"
          if [ "$ADDITIONS" -gt 800 ]; then
            echo "⚠️ Large PR ($ADDITIONS lines). Consider splitting into smaller PRs."
          else
            echo "✅ PR size is acceptable"
          fi
